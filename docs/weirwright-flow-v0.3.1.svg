<text x="600" y="1614" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#585254" text-anchor="middle">Text or JSON  |  Exit 0: no FAIL  |  Exit 1: any FAIL</text>
<text x="72" y="1678" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#585254" text-anchor="start">Reads files only. PASS means recorded evidence meets the rules, not that a change is safe.</text>
